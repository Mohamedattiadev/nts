# Nts quick box (PLAN 156) — Hyprland rules; bridge/install.sh adds them to ~/.config/hypr/rules.conf (copied, not sourced).
# The `move` is an expression rule: it lands at the mouse already on the first frame (no jump), kept inside the
# monitor (right/bottom edge, and 200 px below for the search results). Commas split rule arguments, hence ?: not min().
windowrule = float true,  match:class ^(nts-quick)$
windowrule = pin true,    match:class ^(nts-quick)$
windowrule = move (cursor_x-40>monitor_w-window_w-8?monitor_w-window_w-8:(cursor_x<48?8:cursor_x-40)) (cursor_y-24>monitor_h-window_h-208?monitor_h-window_h-208:(cursor_y<32?8:cursor_y-24)), match:class ^(nts-quick)$
