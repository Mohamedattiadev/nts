# Nts quick box (PLAN 156/156b) — Hyprland rules; bridge/install.sh puts them at the end of ~/.config/hypr/rules.conf (copied, not sourced;
# it replaces an older copy between these marker lines).
# The `move` is an expression rule: it lands at the mouse already on the first frame (no jump), kept inside the
# monitor (right/bottom edge, 40 px spare below for a growing note). Commas split rule arguments, hence ?: not min().
# No Hyprland border (the orange line of the 156 screenshot was the focus border, not the box), rounding = the card's 18 px so the
# shadow fits, no window animation (the box plays its own 120 ms pop; the global popin is 400 ms), no hyprglass blur.
windowrule = float true,  match:class ^(nts-quick)$
windowrule = pin true,    match:class ^(nts-quick)$
windowrule = border_size 0, match:class ^(nts-quick)$
windowrule = rounding 18, match:class ^(nts-quick)$
windowrule = no_anim true, match:class ^(nts-quick)$
windowrule = tag +hyprglass_disabled, match:class ^(nts-quick)$
windowrule = move (cursor_x-40>monitor_w-window_w-8?monitor_w-window_w-8:(cursor_x<48?8:cursor_x-40)) (cursor_y-24>monitor_h-window_h-48?monitor_h-window_h-48:(cursor_y<32?8:cursor_y-24)), match:class ^(nts-quick)$
# end nts-quick
