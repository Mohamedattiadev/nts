<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="description" content="Kendine attığın link, not ve dosyaları topla, düzenle, sor.">
<title>Nts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem('hn-theme');
    var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"></div>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"></span>Nts</div>
    <div id="sideFilters" class="nav"></div>
    <div class="side-sec grow">
      <div class="side-label">Konular</div>
      <div id="sideTags" class="side-tags"></div>
    </div>
    <div class="side-foot">
      <button class="side-row ai" id="aiStatusSide"><span class="dot"></span><span class="lbl">Claude</span><span class="n" id="aiCount"></span></button>
      <button class="side-row" id="settingsSide"></button>
    </div>
  </aside>

  <div class="col">
    <header class="top">
      <div class="brand m-only"><span class="mark"></span>Nts</div>
      <span class="grow m-only"></span>
      <button id="aiStatus" class="pill-status m-only ai" title="Claude"><span class="dot"></span><span class="lbl">Claude</span></button>
      <button id="settingsBtn" class="icon-btn m-only" title="Ayarlar"></button>
    </header>

    <div class="wrap">
      <section class="composer" id="composer">
        <div id="attachList" class="attach-list"></div>
        <div class="c-row">
          <textarea id="input" rows="1" placeholder="Yaz, yapıştır ya da ara…" enterkeyhint="send" autocomplete="off"></textarea>
          <div class="c-actions">
            <label class="icon-btn sm" title="Dosya ekle"><span id="clipIco"></span><input id="fileInput" type="file" multiple hidden></label>
            <button id="askBtn" class="ask-btn" title="Claude'a sor"></button>
            <button id="saveBtn" class="send" title="Kaydet" disabled></button>
          </div>
        </div>
      </section>
      <div class="bar">
        <div id="tabsM" class="tabs m-only"></div>
        <div class="seg" id="viewSwitch"></div>
      </div>
      <div id="qinfo" class="qinfo" hidden></div>
      <div id="answer" class="answer" hidden></div>
    </div>

    <main id="main">
      <div id="list" class="list"></div>
      <div id="gallery" class="gallery" hidden></div>
      <div id="topics" class="list" hidden></div>
      <div id="board" class="board" hidden>
        <div id="plane" class="plane"><svg id="wires" class="wires"></svg></div>
        <div class="board-tools">
          <button id="zoomOut" class="tool" title="Uzaklaş"></button>
          <button id="fitBtn" class="tool"></button>
          <button id="zoomIn" class="tool" title="Yakınlaş"></button>
        </div>
      </div>
      <div id="empty" class="empty" hidden></div>
    </main>
  </div>
</div>

<nav class="tabbar" id="tabbar"></nav>

<div id="toast" class="toast" hidden></div>
<dialog id="sheet" class="drawer"></dialog>
<dialog id="menu" class="drawer"></dialog>

<input id="waInput" type="file" accept=".zip,.txt,application/zip,text/plain" hidden>
<input id="backupInput" type="file" accept=".zip" hidden>

<script src="vendor/jszip.min.js" defer></script>
<script src="db.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
