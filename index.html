<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Kendine attığın link, not ve dosyaları topla, düzenle, sor.">
<title>Nts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 94e: the font never blocks the first screen (system font until Inter arrives; sw.js keeps it for offline) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
  try {
    var t = localStorage.getItem('hn-theme');
    var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var a = localStorage.getItem('hn-accent'), r = document.documentElement;
    if (a && a.charAt(0) === '#') { r.dataset.accent = 'custom'; r.style.setProperty('--accent', a); r.style.setProperty('--accent-soft', 'color-mix(in srgb, ' + a + ' 14%, transparent)'); }
    else if (a && a !== 'orange') r.dataset.accent = a;
    var x = JSON.parse(localStorage.getItem('hn-a11y') || '{}'); // 107k (app.js A11y)
    if (x.fs > 0) r.dataset.fs = x.fs; if (x.hc) r.setAttribute('data-hc', ''); if (x.big) r.setAttribute('data-big', ''); if (x.rm) r.setAttribute('data-rm', '');
    if (localStorage.getItem('hn-glass') === '1') r.setAttribute('data-glass', ''); // 121 (app.js Glass.apply re-checks slow devices)
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  // never leave a blank screen: a script error or a stuck start still uncovers the app
  (function () {
    function uncover() { var s = document.getElementById('splash'); if (s) s.classList.add('gone'); }
    addEventListener('error', function (e) { if (!e.target || e.target === window) uncover(); }, true);
    addEventListener('unhandledrejection', uncover);
    setTimeout(uncover, 6000);
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"></div>
<div id="titlebar" aria-hidden="true"></div>

<div class="app">
  <!-- floating chrome: the canvas is the whole screen -->
  <div class="hud hud-l">
    <button class="bpick" id="boardBtn" title="Hangi pano" aria-haspopup="menu" aria-label="Pano seç"><span class="mark"><svg viewBox="4.5 -4.5 100 100" aria-hidden="true"><path class="mk-b" d="M30 22h40a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H48L32 80V68h-2a10 10 0 0 1-10-10V32a10 10 0 0 1 10-10z"/><path class="mk-l" d="M34 38h30M34 52h18"/><circle class="mk-d" cx="79" cy="21" r="10"/></svg></span><span class="bp-name" id="boardName">Genel</span><svg class="i sm bp-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="chip m-only" id="filterBtn" title="Filtre"><span id="filterLbl">Tümü</span><svg class="i sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <!-- 157d: a project board: items that name the project but aren't on it -->
  <div class="rel-chip" id="relChip" hidden><button class="rc-go" aria-haspopup="dialog" aria-expanded="false"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4M5 17v4M3 19h4"/></svg><span class="rc-n"></span></button><button class="rc-x" aria-label="Bu öneriyi gizle" title="Gizle"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="rel-pop" id="relPop" role="dialog" aria-label="İlgili kayıtlar" hidden></div>
  <!-- desktop: small vertical toolbar, left middle -->
  <nav class="rail d-only" id="rail" aria-label="Filtre"></nav>
  <div class="rail-tab d-only" id="railTab" hidden></div>
  <div id="filterPop" class="pop" hidden>
    <div class="side-label" id="savedLabel" hidden>Kayıtlı aramalar</div>
    <div id="popSaved" class="nav"></div>
    <div class="side-label m-only-b">Göster</div>
    <div id="popTypes" class="nav m-only-b"></div>
    <div class="side-label d-only-b">Listeler</div>
    <div id="popLists" class="nav d-only-b"></div>
    <div class="side-label" id="srcLabel" hidden>Kaynak</div>
    <div id="popSrc" class="nav"></div>
    <div class="side-label">Renk ve sıra</div>
    <div id="sideMarks"></div>
    <div class="side-label" id="projLabel" hidden>Projeler</div>
    <div id="sideProjects" class="side-tags"></div>
    <div class="side-label">Konular</div>
    <div id="tagArc" class="tarc" hidden></div>
    <div id="sideTags" class="side-tags"></div>
  </div>
  <div class="hud hud-c"><div class="seg" id="viewSwitch"></div></div>
  <div class="hud hud-r">
    <button id="syncBtn" class="chip icon sync" hidden aria-label="Senkron"></button>
    <button id="settingsBtn" class="chip icon ai" title="Ayarlar"><span id="setIco"></span><span class="dot badge"></span></button>
  </div>

  <main id="main">
    <div id="cal" class="cal" hidden></div>
    <div id="list" class="list"></div>
    <div id="gallery" class="gallery" hidden></div>
    <div id="topics" class="list" hidden></div>
    <div id="todo" class="todo" hidden></div>
    <div id="study" class="study" hidden></div>
    <div id="board" class="board" hidden>
      <div id="plane" class="plane"><svg id="wires" class="wires"></svg><svg id="ink" class="ink"></svg></div>
      <div id="months" class="months-grid" hidden></div>
    </div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <div class="board-tools pal" id="pal" hidden aria-label="Araçlar"></div>
  <div class="board-tools" id="boardTools" hidden>
    <button id="zoomOut" class="tool" title="Uzaklaş"></button>
    <button id="zoomPct" class="tool pct" title="%100'e dön"></button>
    <button id="zoomIn" class="tool" title="Yakınlaş"></button>
    <button id="rangeBtn" class="tool range" title="Panoda hangi zaman (boş yere sağ tık)" aria-haspopup="menu"></button><button id="rangeX" class="tool range-x" title="Varsayılan aralığa dön" aria-label="Aralığı kaldır" hidden></button>
    <button id="fitBtn" class="tool" title="Hepsini göster (Shift+1)"></button>
    <button id="tidyBtn" class="tool" title="Otomatik diz: günlere göre"></button>
  </div>

  <!-- the one box, bottom centre (like a chat box) -->
  <div class="dock">
    <div id="answer" class="answer" hidden></div>
    <div id="hits" class="hits" hidden></div>
    <section class="composer" id="composer">
      <div id="attachList" class="attach-list"></div>
      <div class="c-row">
        <label class="c-btn" title="Dosya ekle"><span id="clipIco"></span><input id="fileInput" type="file" multiple hidden></label>
        <div id="modes" class="modes"></div>
        <textarea id="input" rows="1" placeholder="Not yaz…" enterkeyhint="send" dir="auto" autocomplete="off"></textarea>
        <button id="micBtn" type="button" class="c-btn mic" hidden><span id="micIco"></span></button>
        <button id="saveBtn" class="send" title="Kaydet (Enter)" disabled></button>
      </div>
      <div id="cHint" class="c-hint" hidden></div>
    </section>
  </div>
</div>

<div id="toast" class="toast" popover="manual" role="status" hidden></div>
<dialog id="sheet" class="drawer modal"></dialog>
<dialog id="menu" class="drawer modal narrow"></dialog>

<input id="waInput" type="file" accept=".zip,.txt,application/zip,text/plain" hidden>
<input id="backupInput" type="file" accept=".zip" hidden>
<input id="migInput" type="file" accept=".zip,.json,.enex,.html,.htm,.md,application/zip,application/json,text/html,text/markdown" multiple hidden>
<input id="bmInput" type="file" accept=".html,.htm,text/html" hidden>

<script src="db.js" defer></script>
<script src="query.js" defer></script>
<script src="when.js" defer></script>
<script src="dedup.js" defer></script>
<script src="migrate.js" defer></script>
<script src="ed.js" defer></script>
<script src="app.js" defer></script>
<script src="export.js" defer></script>
<script src="priv.js" defer></script>
</body>
</html>
